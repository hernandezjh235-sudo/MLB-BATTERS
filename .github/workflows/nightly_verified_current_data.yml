name: Nightly verified MLB data refresh

on:
  schedule:
    # 06:30 UTC = 10:30 PM PST / 11:30 PM PDT. Always after 10 PM Pacific.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-verified-mlb-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install refresh dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.1,<3" "requests>=2.31,<3"

      - name: Stage, validate, and promote 2026 batter + pitcher data
        run: python refresh_verified_current_data.py --season 2026 --root data/verified_current

      - name: Commit only a verified promotion
        shell: bash
        run: |
          if git diff --quiet -- data/verified_current; then
            echo "No verified data changes to commit."
            exit 0
          fi
          git config user.name "mlb-data-refresh[bot]"
          git config user.email "mlb-data-refresh[bot]@users.noreply.github.com"
          git add data/verified_current
          git commit -m "Nightly verified 2026 MLB data refresh"
          git push origin HEAD:main
