name: Temporary Savant Refresh
on:
  push:
    branches:
      - tmp-savant-refresh-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas requests
      - name: Fetch Savant data
        run: python tmp_savant_refresh.py
      - name: Upload refresh output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: savant-refresh-20260820
          path: savant_refresh_output/
          if-no-files-found: warn
          retention-days: 1
