name: Verify MLB data pipeline 1-16

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "railway.json"
      - "patch_railway_persistence.py"
      - "patch_verified_current_savant.py"
      - "patch_verified_identity_matching.py"
      - "patch_schedule_team_ids.py"
      - "patch_verified_split_cache.py"
      - "patch_verified_matchup_cache.py"
      - "bootstrap_verified_data.py"
      - "verify_verified_current_savant.py"
      - "verify_data_pipeline_1_16.py"
      - "refresh_verified_current_data.py"
      - ".github/workflows/verify_data_pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.1,<3" "requests>=2.31,<3"

      - name: Compile data sidecars
        run: |
          python -m py_compile \
            patch_railway_persistence.py \
            patch_verified_current_savant.py \
            patch_verified_identity_matching.py \
            patch_schedule_team_ids.py \
            patch_verified_split_cache.py \
            patch_verified_matchup_cache.py \
            bootstrap_verified_data.py \
            verify_verified_current_savant.py \
            verify_data_pipeline_1_16.py \
            refresh_verified_current_data.py

      - name: Apply data-only patches to temporary checkout
        run: |
          python patch_railway_persistence.py
          python patch_verified_current_savant.py
          python patch_verified_identity_matching.py
          python patch_schedule_team_ids.py
          python patch_verified_split_cache.py
          python patch_verified_matchup_cache.py
          python bootstrap_verified_data.py

      - name: Compile patched full app
        run: python -m py_compile app.py

      - name: Verify current Savant guard
        run: python verify_verified_current_savant.py

      - name: Verify all 1-16 data contracts
        run: python verify_data_pipeline_1_16.py
